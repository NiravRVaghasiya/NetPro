[project]
name = "netpro-backend"
version = "0.1.0"
description = "NetPro — local-first professional relationship intelligence (Python foundation, migration Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NetPro contributors" }]
keywords = ["crm", "network-intelligence", "local-first", "graph", "search"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Runtime stack, as fixed by docs/adr/0002-python-api-and-data-stack.md.
# Every entry is a Phase 1 *configuration* decision: only FastAPI, Pydantic,
# Typer, httpx, and uvicorn are imported by Phase 1 code. SQLAlchemy and
# Alembic are declared now so Phase 2 lands as a dependency-free change.
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "typer>=0.12",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
# The Python CLI takes over the `netpro` name inside a Python environment.
# Phase 1 ships `version` and `serve` only; the full command surface is
# migration Phase 13. The npm `netpro` binary is untouched.
netpro = "netpro.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netpro"]

# ── Ruff (lint + format) ───────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ASYNC",# flake8-async
  "PT",   # flake8-pytest-style
  "ANN",  # flake8-annotations
  "TID",  # flake8-tidy-imports
  "D",    # pydocstyle
  "RUF",  # ruff-specific
]
ignore = [
  "D203",   # one-blank-line-before-class (conflicts with D211)
  "D213",   # multi-line-summary-second-line (conflicts with D212)
  "ANN401", # `Any` is allowed at the framework boundary (ASGI scope, JSON bodies)
  "RUF001", "RUF002", "RUF003", # en dashes / × are intentional in prose (as in the TS docs)
  # PEP 695 (`class Page[T]:`) is deliberately not used: the code stays parseable
  # by a 3.11 interpreter so the suite can be verified on any modern toolchain,
  # while `requires-python` keeps the documented 3.12+ floor.
  "UP046", "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"] # tests are prose in code; docstrings are noise there

[tool.ruff.lint.isort]
known-first-party = ["netpro"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ── mypy ───────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "contract: asserts parity with the frozen TypeScript API fixtures (docs/python-migration/fixtures)",
]
