name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the workspace-wide `engines` floor; 22 is what contributors and
        # Vercel actually run. A native addon (better-sqlite3) and Next.js 16
        # make the difference worth covering.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  postgres:
    # Phases 1–5 shipped Postgres support that compiled but was never executed
    # against a real server. That gap hid a migration race that failed 5 of 6
    # concurrent cold starts — precisely what a Vercel deploy does. This job
    # exists so that can never regress unnoticed again.
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpro
          POSTGRES_PASSWORD: netpro
          POSTGRES_DB: netpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netpro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NETPRO_TEST_DATABASE_URL: postgresql://netpro:netpro@127.0.0.1:5432/netpro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live PostgreSQL integration tests
        run: npm run test -w @netpro/db

      - name: Verify the migration CLI against a real database
        env:
          DB_DIALECT: postgresql
          DATABASE_URL: postgresql://netpro:netpro@127.0.0.1:5432/netpro?sslmode=disable
        run: |
          npm run build -w @netpro/cli
          node apps/cli/dist/index.js migrate --status
          node apps/cli/dist/index.js migrate
          # Applying twice must be a no-op, not an error: every redeploy and
          # every extra container repeats this.
          node apps/cli/dist/index.js migrate

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the self-hosting image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: netpro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image against Postgres
        run: |
          docker network create netpro-ci
          docker run -d --name db --network netpro-ci \
            -e POSTGRES_USER=netpro -e POSTGRES_PASSWORD=netpro -e POSTGRES_DB=netpro \
            --health-cmd "pg_isready -U netpro" --health-interval 5s \
            postgres:16-alpine
          # Wait for the database to accept connections before migrating.
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = "healthy" ] && break
            sleep 2
          done

          # The migration job the compose stack runs, using the shipped CLI.
          docker run --rm --network netpro-ci \
            -e DB_DIALECT=postgresql \
            -e DATABASE_URL='postgresql://netpro:netpro@db:5432/netpro?sslmode=disable' \
            netpro:ci node /app/apps/cli/dist/index.js migrate

          docker run -d --name web --network netpro-ci -p 3000:3000 \
            -e DB_DIALECT=postgresql \
            -e DATABASE_URL='postgresql://netpro:netpro@db:5432/netpro?sslmode=disable' \
            -e NEXTAUTH_SECRET=ci-only-secret-not-a-real-credential \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e AUTH_URL=http://localhost:3000 \
            -e NETPRO_OWNER_GITHUB_ID=1 \
            netpro:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- health ---"
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json
          grep -q '"dialect":"postgresql"' /tmp/health.json

          echo "--- auth boundaries ---"
          # Private API must reject anonymous callers; the unpublished public
          # card must 404 rather than leak a draft.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/card)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/card)" = "404"

          echo "--- no UntrustedHost / auth misconfiguration in logs ---"
          # This is the Phase 6 production auth bug: it only appears at runtime
          # in a production build, so a build-only check cannot catch it.
          docker logs web 2>&1 | tee /tmp/web.log
          ! grep -qi "UntrustedHost" /tmp/web.log

          docker rm -f web db >/dev/null
          docker network rm netpro-ci >/dev/null
