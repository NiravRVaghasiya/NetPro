name: CI

# Phase 21 — CI validates the actual local-first architecture, in order:
#
#   Install → Lint → Typecheck → Unit tests → SQLite integration tests
#          → PostgreSQL integration tests → Build
#          → CLI smoke → Server smoke (SQLite + PostgreSQL) → Web UI smoke
#          → Docker image e2e
#
# Every job provisions from the same `npm ci` step (Install), and the
# `needs:` chain below is the ordered gate list. The smoke stages after the
# build exercise the shipped artifacts as real OS processes:
#
#   scripts/smoke/cli.sh         netpro init / migrate / serve / status
#   scripts/smoke/local-stack.sh netpro serve, /api/health, API calls, SSE,
#                                the loopback auth boundary, standalone bin
#                                (runs once per database dialect)
#   scripts/smoke/web-ui.sh      the production standalone Next.js output
#
# The Docker job additionally proves the published image serves the Web UI
# and every auth boundary against PostgreSQL.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint + typecheck ────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the workspace-wide `engines` floor; 22 is what contributors
        # run. The native addon (better-sqlite3) and Next.js 16 make the
        # difference worth covering.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ── 2. Unit tests (hermetic; real scratch SQLite files) ────────────────
  unit:
    name: Unit tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The vitest suite is hermetic (Postgres-specific suites self-skip
      # without NETPRO_TEST_DATABASE_URL) and exercises SQL behaviour against
      # real scratch SQLite files, not mocks.
      - name: Run unit tests
        run: npm run test

  # ── 3. SQLite integration — package suites over real SQLite + marketplace
  sqlite-integration:
    name: SQLite integration (real database + marketplace)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_DIALECT: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: '22'
        cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Integration-flavoured suites that open real SQLite databases on disk:
      # migration application/FTS (db) and the CLI command executor wiring
      # (cli). The broader unit run happened in the previous stage.
      - name: Run SQLite integration suites
        run: npm run test -w @netpro/db -w @netpro/cli

      - name: Build the CLI for the marketplace smoke
        run: npm run build -w @netpro/cli

      # v3.0 Phase 6: the reference plugin installs from the shipped index
      # end-to-end — index fetch, checksum verify, extract, register
      # disabled, permissions-gated enable — over a scratch sqlite database.
      # file:// URLs keep the smoke hermetic (no network beyond npm).
      - name: Marketplace end-to-end smoke
        env:
          MARKETPLACE_INDEX_URL: "file://$PWD/marketplace/index.json"
          MARKETPLACE_NO_CACHE: 'true'
          NETPRO_PLUGIN_DIR: "$RUNNER_TEMP/netpro-plugins"
          DB_PATH: "$RUNNER_TEMP/netpro-marketplace.db"
        run: |
          node apps/cli/dist/index.js plugin search example
          node apps/cli/dist/index.js plugin install example-event-discovery
          node apps/cli/dist/index.js plugin update example-event-discovery
          node apps/cli/dist/index.js plugin enable example-event-discovery --i-have-reviewed-permissions
          node apps/cli/dist/index.js plugin list
          test -f "$NETPRO_PLUGIN_DIR/example-event-discovery/manifest.json"

  # ── 4. PostgreSQL integration — real database server ───────────────────
  postgres-integration:
    name: PostgreSQL integration
    needs: sqlite-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpro
          POSTGRES_PASSWORD: netpro
          POSTGRES_DB: netpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netpro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NETPRO_TEST_DATABASE_URL: postgresql://netpro:netpro@127.0.0.1:5432/netpro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: '22'
        cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live PostgreSQL integration tests
        run: npm run test -w @netpro/db

      # v2.0 Phase 4: the hybrid search engine's keyword arm is the only
      # dialect-specific SQL in packages/core. SQLite covers it in-memory;
      # this runs the same `searchContacts` entry point against a real server
      # so tsvector/GIN/to_tsquery are proven, not just typechecked.
      - name: Run core PostgreSQL suites
        run: |
          npm run test -w @netpro/core -- src/crypto/postgres.integration.test.ts
          npm run test -w @netpro/core -- src/search/postgres.integration.test.ts
          npm run test -w @netpro/core -- src/events/postgres.integration.test.ts
          npm run test -w @netpro/core -- src/content/postgres.integration.test.ts
          npm run test -w @netpro/core -- src/views/postgres.integration.test.ts

      # v2.0 Phase 7: the release-cut performance pass against PostgreSQL.
      # Skipped locally (no NETPRO_TEST_DATABASE_URL), so `npm test` stays
      # hermetic.
      - name: Run the release performance pass against PostgreSQL
        run: npm run test -w @netpro/core -- src/postgres.perf.test.ts

      - name: Build the CLI for the migration checks
        run: npm run build -w @netpro/cli

      # The deploy step (docker-compose migration job) against a real server,
      # including the advisory-lock idempotency every redeploy relies on.
      - name: Verify the migration CLI against a real database
        env:
          DB_DIALECT: postgresql
          DATABASE_URL: postgresql://netpro:netpro@127.0.0.1:5432/netpro?sslmode=disable
        run: |
          node apps/cli/dist/index.js migrate --status
          node apps/cli/dist/index.js migrate
          # Applying twice must be a no-op, not an error: every redeploy and
          # every extra container repeats this.
          node apps/cli/dist/index.js migrate

  # ── 5. Build — every workspace, including the standalone Web UI ────────
  build:
    name: Build all workspaces
    needs: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: '22'
        cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundled CLI is self-contained
        run: npm run package:check

  # ── 6. CLI smoke — netpro init / migrate / serve / status as processes ─
  cli-smoke:
    name: CLI smoke (SQLite)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: '22'
        cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI and standalone server
        run: npm run build -w @netpro/cli -w @netpro/server

      # Scratch NETPRO_HOME: --help surface, init (identity/config/0600
      # token/15 migrations), idempotent re-init, migrate --status + no-op
      # migrate, serve from the CLI, status observes it, graceful SIGTERM.
      - name: CLI process smoke
        run: scripts/smoke/cli.sh

  # ── 7. Server smoke — health, API calls, SSE, auth boundary ────────────
  # One leg per database dialect. The PostgreSQL leg shares the 16-alpine
  # service definition with the integration stage; the SQLite leg ignores it.
  server-smoke:
    name: Server smoke (${{ matrix.dialect }})
    needs: cli-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dialect: ['sqlite', 'postgresql']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netpro
          POSTGRES_PASSWORD: netpro
          POSTGRES_DB: netpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netpro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: '22'
        cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI and standalone server
        run: npm run build -w @netpro/cli -w @netpro/server

      # netpro init → netpro serve → /api/health (dialect startup) →
      # contacts/jobs/settings/providers/search/graph API calls → observable
      # scan job → SSE search.started/search.completed → console page →
      # proxied 401 vs bearer 200 boundary → netpro status → standalone
      # netpro-server bin → graceful SIGTERM.
      - name: Server process smoke (${{ matrix.dialect }})
        env:
          SMOKE_DIALECT: ${{ matrix.dialect }}
          DATABASE_URL: ${{ matrix.dialect == 'postgresql' && 'postgresql://netpro:netpro@127.0.0.1:5432/netpro?sslmode=disable' || '' }}
        run: scripts/smoke/local-stack.sh

  # ── 8. Web UI smoke — production standalone output really serves ───────
  web-ui-smoke:
    name: Web UI smoke (standalone production build)
    needs: server-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
        node-version: '22'
        cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the Web UI and CLI
        run: npm run build -w apps/web -w @netpro/cli

      # Stages apps/web/.next/standalone like the Docker runner, starts it on
      # loopback with a scratch SQLite install, and asserts: landing page +
      # security headers, /login, /api/health on SQLite, the private
      # Observatory trusted from loopback, a /_next/static asset, clean exit.
      - name: Web UI loading smoke
        run: scripts/smoke/web-ui.sh

  # ── 9. Docker self-hosted e2e — the published deployment shape ─────────
  docker:
    name: Docker image e2e (PostgreSQL + Web UI)
    needs: web-ui-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the self-hosting image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: netpro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Split into granular steps on purpose. GitHub's log blob is not always
      # retrievable via the API/CLI, but per-step conclusions and ::error::
      # annotations always are, so a failure here is diagnosable from the API
      # alone instead of needing the raw log.
      - name: Start Postgres
        run: |
          docker network create netpro-ci
          docker run -d --name db --network netpro-ci \
            -e POSTGRES_USER=netpro -e POSTGRES_PASSWORD=netpro -e POSTGRES_DB=netpro \
            --health-cmd "pg_isready -U netpro" --health-interval 5s \
            postgres:16-alpine
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = "healthy" ] && break
            sleep 2
          done
          status="$(docker inspect -f '{{.State.Health.Status}}' db)"
          if [ "$status" != "healthy" ]; then
            echo "::error::Postgres never became healthy (status=$status)"
            docker logs db 2>&1 | tail -50
            exit 1
          fi

      # The migration job the compose stack runs, using the shipped CLI. This
      # is the step that caught ERR_MODULE_NOT_FOUND for CLI dependencies that
      # were left unbundled but not copied into the runner stage.
      - name: Run migrations via the shipped CLI
        run: |
          if ! docker run --rm --network netpro-ci \
            -e DB_DIALECT=postgresql \
            -e DATABASE_URL='postgresql://netpro:netpro@db:5432/netpro?sslmode=disable' \
            netpro:ci node /app/apps/cli/dist/index.js migrate > /tmp/migrate.log 2>&1; then
            echo "::error::CLI migrate failed inside the image"
            sed -n '1,80p' /tmp/migrate.log
            echo "::error::migrate output: $(tr '\n' ' ' < /tmp/migrate.log | head -c 800)"
            exit 1
          fi
          cat /tmp/migrate.log

      - name: "Start the web container (phase 5: no credentials at all)"
        run: |
          # The Phase 5 exit criterion, exercised in CI: the production image
          # starts and serves with DB_DIALECT/DATABASE_URL alone. No
          # GITHUB_CLIENT_ID, no GITHUB_CLIENT_SECRET, no
          # NETPRO_OWNER_GITHUB_ID, no NEXTAUTH_SECRET, no NEXTAUTH_URL.
          # NETPRO_TRUST_LOCAL_UI=1 is the operator's assertion that the
          # instance is reachable only from this machine: inside the container
          # the socket peer is the Docker bridge, so the loopback check cannot
          # pass on its own (docker-compose.yml publishes on 127.0.0.1 and sets
          # the same flag).
          docker run -d --name web --network netpro-ci -p 3000:3000 \
            -e DB_DIALECT=postgresql \
            -e DATABASE_URL='postgresql://netpro:netpro@db:5432/netpro?sslmode=disable' \
            -e NETPRO_TRUST_LOCAL_UI=1 \
            netpro:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
            echo "::error::Web container never served /api/health"
            docker logs web 2>&1 | tail -80
            echo "::error::web log: $(docker logs web 2>&1 | tr '\n' ' ' | tail -c 800)"
            exit 1
          fi

      - name: Check health, Web UI loading, auth boundaries and logs
        run: |
          echo "--- health ---"
          curl -fsS http://127.0.0.1:3000/api/health | tee /tmp/health.json
          grep -q '"status":"healthy"' /tmp/health.json || {
            echo "::error::health not healthy: $(cat /tmp/health.json)"; exit 1; }
          grep -q '"dialect":"postgresql"' /tmp/health.json || {
            echo "::error::health dialect not postgresql: $(cat /tmp/health.json)"; exit 1; }

          echo "--- Web UI loading (Phase 21) ---"
          curl -fsS http://127.0.0.1:3000/ -D /tmp/landing.headers -o /tmp/landing.html
          grep -qi 'HTTP/.*200' /tmp/landing.headers || { echo "::error::landing page not 200"; exit 1; }
          grep -q '<title>NetPro' /tmp/landing.html || { echo "::error::landing page is not NetPro"; exit 1; }
          grep -q 'Private\. Local\. Searchable\.' /tmp/landing.html || {
            echo "::error::landing page is not the local-first on-ramp"; exit 1; }
          login_code="$(curl -s -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:3000/login)"
          [ "$login_code" = "200" ] || { echo "::error::/login expected 200, got $login_code"; exit 1; }
          asset="$(grep -oE '/_next/static/[^"]+\.js' /tmp/landing.html | head -1)"
          [ -n "$asset" ] || { echo "::error::no static asset referenced by the landing page"; exit 1; }
          curl -fsS "http://127.0.0.1:3000$asset" -o /dev/null || {
            echo "::error::static asset $asset failed"; exit 1; }

          echo "--- local mode trusts this machine (phase 5) ---"
          # A request whose Host is loopback comes from the operator, so the
          # private API answers it without any sign-in at all.
          local_card="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/card)"
          [ "$local_card" = "200" ] || { echo "::error::local /api/card expected 200, got $local_card"; exit 1; }

          echo "--- auth boundaries ---"
          # Private API must reject callers that did not come from this
          # machine. Phase 5 local mode decides that from the Host header
          # (plus the absence of proxy headers), so the remote case is
          # exercised with a non-loopback Host — the same shape an attacker
          # reaches the container with.
          REMOTE=(-H 'Host: netpro.example')
          api_card="$(curl -s -o /dev/null -w '%{http_code}' "${REMOTE[@]}" http://127.0.0.1:3000/api/card)"
          [ "$api_card" = "401" ] || { echo "::error::remote /api/card expected 401, got $api_card"; exit 1; }
          # A forwarded request is not local even when the Host says loopback.
          proxied="$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 203.0.113.7' http://127.0.0.1:3000/api/card)"
          [ "$proxied" = "401" ] || { echo "::error::proxied /api/card expected 401, got $proxied"; exit 1; }
          # v2.0 Phase 6: every owner-only route added since has to answer the
          # same way in a production build, not just in unit tests.
          for path in /api/events /api/events/anything /api/events/anything/match /api/graph/overview /api/skills/gap; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${REMOTE[@]}" "http://127.0.0.1:3000${path}")"
            [ "$code" = "401" ] || { echo "::error::remote ${path} expected 401, got $code"; exit 1; }
          done
          # v2.5 Phase 7: the analytics and content surfaces joined the
          # owner-only boundary; the beacons stay public but must behave like
          # it (no 401, no Set-Cookie, nosniff) in a production build.
          for path in /api/analytics /api/card/views /api/content /api/content/anything /api/content/anything/metrics /api/content/anything/mentions; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${REMOTE[@]}" "http://127.0.0.1:3000${path}")"
            [ "$code" = "401" ] || { echo "::error::remote ${path} expected 401, got $code"; exit 1; }
          done
          pixel="$(curl -s -D - -o /dev/null http://127.0.0.1:3000/api/card/pixel.gif)"
          echo "$pixel" | head -1 | grep -q ' 200 ' || { echo "::error::pixel.gif expected 200, got: $(echo "$pixel" | head -1)"; exit 1; }
          echo "$pixel" | grep -qi 'cache-control:.*no-store' || { echo "::error::pixel.gif missing no-store"; exit 1; }
          echo "$pixel" | grep -qi 'x-content-type-options: nosniff' || { echo "::error::pixel.gif missing nosniff"; exit 1; }
          if echo "$pixel" | grep -qi '^set-cookie:'; then echo "::error::pixel.gif set a cookie"; exit 1; fi
          preflight="$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:3000/api/card/view)"
          [ "$preflight" = "204" ] || { echo "::error::/api/card/view OPTIONS expected 204, got $preflight"; exit 1; }
          beacon="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"page":"/card"}' http://127.0.0.1:3000/api/card/view)"
          [ "$beacon" = "200" ] || { echo "::error::/api/card/view beacon expected 200, got $beacon"; exit 1; }
          card="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/card)"
          [ "$card" = "404" ] || { echo "::error::/card expected 404, got $card"; exit 1; }

          echo "--- no UntrustedHost / auth misconfiguration in logs ---"
          # This is the Phase 6 production auth bug: it only appears at runtime
          # in a production build, so a build-only check cannot catch it.
          docker logs web 2>&1 | tee /tmp/web.log
          if grep -qi "UntrustedHost" /tmp/web.log; then
            echo "::error::UntrustedHost present in web logs"
            exit 1
          fi

      - name: Re-check the boundary in GitHub mode
        run: |
          # Phase 5 keeps the v3.0 deployment shape available: with
          # NETPRO_AUTH_MODE=github nothing is trusted, not even loopback —
          # every caller must sign in. The credentials are fake on purpose;
          # only the 401 path is under test.
          docker rm -f web >/dev/null 2>&1 || true
          docker run -d --name web --network netpro-ci -p 3000:3000 \
            -e DB_DIALECT=postgresql \
            -e DATABASE_URL='postgresql://netpro:netpro@db:5432/netpro?sslmode=disable' \
            -e NETPRO_AUTH_MODE=github \
            -e NEXTAUTH_SECRET=ci-only-secret-not-a-real-credential \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e AUTH_URL=http://localhost:3000 \
            -e GITHUB_CLIENT_ID=ci-fake-client-id \
            -e GITHUB_CLIENT_SECRET=ci-fake-client-secret \
            -e NETPRO_OWNER_GITHUB_ID=1 \
            netpro:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for path in /api/card /api/events /api/graph/overview; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")"
            [ "$code" = "401" ] || { echo "::error::github-mode ${path} expected 401 even from loopback, got $code"; exit 1; }
          done
          # Web UI loading still works in GitHub mode — it redirects to the
          # sign-in page instead of rendering the app, but it must not crash.
          login_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)"
          [ "$login_code" = "200" ] || { echo "::error::github-mode /login expected 200, got $login_code"; exit 1; }
          docker logs web 2>&1 | tee /tmp/web-github.log
          if grep -qi "UntrustedHost" /tmp/web-github.log; then
            echo "::error::UntrustedHost present in GitHub-mode web logs"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: |
          docker rm -f web db >/dev/null 2>&1 || true
          docker network rm netpro-ci >/dev/null 2>&1 || true
