name: Python backend

# Python CI alongside the TypeScript CI (migration plan §27). Runs on the
# standard runners where Python 3.12/3.13 are preinstalled — the sandbox
# bootstrap story in backend/README.md does not apply here.
#
# Pipeline: install (uv, locked) → lint → format → typecheck → test.
# The TypeScript CI (ci.yml) stays untouched and stays green until Phase 17.

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/python-backend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/python-backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
